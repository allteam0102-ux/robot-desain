# File ini diletakkan di: .github/workflows/generate.yml
# Menjalankan robot desain otomatis tiap 20 menit, GRATIS.
# (Termasuk .NET, libssl1.1, dan pemasangan lisensi Aspose untuk PSD.)

name: Robot Desain Konten

on:
  schedule:
    - cron: "*/20 * * * *"    # tiap 20 menit (UTC)
  workflow_dispatch:           # tombol "Run workflow" buat tes manual

jobs:
  jalankan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Siapkan .NET (untuk Aspose/PSD)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Pasang libssl1.1 (dibutuhkan mesin Aspose)
        run: |
          URL1="http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb"
          URL2="http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb"
          wget -q "$URL1" -O /tmp/libssl.deb || wget -q "$URL2" -O /tmp/libssl.deb
          sudo dpkg -i /tmp/libssl.deb

      - name: Install kebutuhan
        run: pip install -r requirements.txt

      - name: Pasang lisensi Aspose (kalau ada)
        env:
          ASPOSE_LICENSE: ${{ secrets.ASPOSE_LICENSE }}
        run: |
          if [ -n "$ASPOSE_LICENSE" ]; then
            printf '%s' "$ASPOSE_LICENSE" > "$GITHUB_WORKSPACE/Aspose.lic"
            echo "ASPOSE_LICENSE_PATH=$GITHUB_WORKSPACE/Aspose.lic" >> "$GITHUB_ENV"
            echo "Lisensi Aspose terpasang."
          else
            echo "Tidak ada lisensi Aspose (mode gratis)."
          fi

      - name: Jalankan robot
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS_TYPE: ${{ secrets.STATUS_TYPE }}
          ASPOSE_METERED_PUBLIC: ${{ secrets.ASPOSE_METERED_PUBLIC }}
          ASPOSE_METERED_PRIVATE: ${{ secrets.ASPOSE_METERED_PRIVATE }}
        run: python main.py
