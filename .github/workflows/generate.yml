# File ini diletakkan di: .github/workflows/generate.yml
name: Robot Desain Nikah Institute
on:
  schedule:
    - cron: "*/5 * * * *"     # cek tiap 5 menit (batas tercepat GitHub)
  workflow_dispatch:           # tombol "Run workflow" manual
  repository_dispatch:         # pintu buat jalur INSTAN (opsional, lewat relay Notion->GitHub)
    types: [notion-siap-desain]

# izin menulis balik file memori (memory.json) ke repo
permissions:
  contents: write

jobs:
  jalankan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install kebutuhan
        run: pip install -r requirements.txt

      - name: Jalankan robot
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS_TYPE: ${{ secrets.STATUS_TYPE }}
          LOGO_URL: ${{ secrets.LOGO_URL }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Simpan memori belajar (memory.json)
        if: always()
        run: |
          if [ -f memory.json ]; then
            git config user.name "nikah-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add memory.json
            git commit -m "update memori belajar [skip ci]" || echo "tidak ada perubahan memori"
            git pull --rebase --autostash || true
            git push || echo "push dilewati"
          else
            echo "memory.json belum dibuat (belum ada feedback)."
          fi
