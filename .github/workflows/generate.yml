# File ini diletakkan di: .github/workflows/generate.yml
# Menjalankan robot desain otomatis tiap 20 menit, GRATIS.
# (Versi ini menambahkan .NET untuk output PSD via Aspose.)

name: Robot Desain Konten

on:
  schedule:
    - cron: "*/20 * * * *"    # tiap 20 menit (UTC)
  workflow_dispatch:           # tombol "Run workflow" buat tes manual

jobs:
  jalankan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Siapkan .NET (untuk Aspose/PSD)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Install kebutuhan
        run: pip install -r requirements.txt

      - name: Jalankan robot
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS_TYPE: ${{ secrets.STATUS_TYPE }}
          # Kosongkan (jangan bikin secret-nya) untuk mode GRATIS/watermark.
          # Isi kalau sudah punya metered license Aspose (watermark hilang):
          ASPOSE_METERED_PUBLIC: ${{ secrets.ASPOSE_METERED_PUBLIC }}
          ASPOSE_METERED_PRIVATE: ${{ secrets.ASPOSE_METERED_PRIVATE }}
        run: python main.py
